---
# Source: renovate/charts/valkey/templates/statefulset.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: renovate-valkey
  labels:
    helm.sh/chart: valkey-1.0.0
    app.kubernetes.io/name: valkey
    app.kubernetes.io/instance: renovate
    app.kubernetes.io/version: "9.1.3"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: valkey
spec:
  serviceName: renovate-valkey-headless
  replicas: 1
  podManagementPolicy: OrderedReady
  selector:
    matchLabels:
      app.kubernetes.io/name: valkey
      app.kubernetes.io/instance: renovate
  volumeClaimTemplates:
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: valkey-data
    spec:
      accessModes: 
        - ReadWriteOnce
      storageClassName: "nfs1"
      resources:
        requests:
          storage: "100Mi"
  template:
    
    metadata:
      labels:
        app.kubernetes.io/name: valkey
        app.kubernetes.io/instance: renovate
        app.kubernetes.io/component: valkey
      annotations:
        checksum/initconfig: "ef82441cb8c8fa1c596e3c08e36fc9fd"
    spec:
      
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      serviceAccountName: renovate-valkey
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: init
          image: docker.io/valkey/valkey:9.1.3
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          command: [ "/scripts/init.sh" ]
          env:
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            # Where the ordinal comes from when the pod-index label is missing
            # (Kubernetes < 1.28); unlike HOSTNAME, always set and never an FQDN
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          volumeMounts:
            - name: valkey-data
              mountPath: /data
            - name: valkey-conf
              mountPath: /valkey-conf
            - name: scripts
              mountPath: /scripts
      containers:
        - name: valkey
          image: docker.io/valkey/valkey:9.1.3
          imagePullPolicy: IfNotPresent
          command: [ "valkey-server" ]
          args: [ "/valkey-conf/valkey.conf" ]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 1000
          env:
            - name: POD_INDEX
              valueFrom:
                fieldRef:
                  fieldPath: metadata.labels['apps.kubernetes.io/pod-index']
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
          ports:
            - name: tcp
              containerPort: 6379
              protocol: TCP
          livenessProbe:
            exec:
              command:
              - sh
              - -c
              - r=$('valkey-cli' '-p' '6379' 'ping' 2>&1); case "$r" in PONG|LOADING*) exit
                0;; esac; echo "$r"; exit 1
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          readinessProbe:
            exec:
              command:
              - sh
              - -c
              - r=$('valkey-cli' '-p' '6379' 'ping' 2>&1); case "$r" in PONG) exit 0;; esac;
                echo "$r"; exit 1
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            successThreshold: 1
            timeoutSeconds: 1
          startupProbe:
            exec:
              command:
              - sh
              - -c
              - r=$('valkey-cli' '-p' '6379' 'ping' 2>&1); case "$r" in PONG|LOADING*) exit
                0;; esac; echo "$r"; exit 1
            failureThreshold: 3
            initialDelaySeconds: 0
            periodSeconds: 10
            timeoutSeconds: 1
          resources:
            limits:
              cpu: 300m
              memory: 48Mi
            requests:
              cpu: 15m
              memory: 24Mi
          volumeMounts:
            - name: valkey-data
              mountPath: /data
            - name: valkey-conf
              mountPath: /valkey-conf
        - name: metrics
          image: ghcr.io/oliver006/redis_exporter:v1.88.0
          imagePullPolicy: "IfNotPresent"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
          ports:
            - name: metrics
              containerPort: 9121
          startupProbe:
            tcpSocket:
              port: metrics
          livenessProbe:
            tcpSocket:
              port: metrics
          readinessProbe:
            httpGet:
              path: /
              port: metrics
          resources:
            limits:
              cpu: 100m
              memory: 48Mi
            requests:
              cpu: 5m
              memory: 24Mi
          env:
            - name: REDIS_ALIAS
              value: renovate-valkey
            - name: REDIS_ADDR
              value: "redis://localhost:6379"
      volumes:
        # Holds valkey.conf and users.acl, which init.sh generates there. Memory
        # backed because valkey.conf carries credentials in plain text, and with
        # replication CONFIG REWRITE rewrites them into it whenever Sentinel
        # changes the topology.
        - name: valkey-conf
          emptyDir:
            medium: Memory
        - name: scripts
          configMap:
            name: renovate-valkey-init-scripts
            defaultMode: 0555

