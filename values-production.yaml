global:
  stage: production
renovate:
  cronjob:
    activeDeadlineSeconds: 3060
  resources:
    limits:
     cpu: 1500m
     memory: 1536Mi
    requests:
     memory: 768Mi

valkey:
  # Renovate's cache is disposable and replicas sync diskless, so skip RDB
  # snapshots to keep valkey off the (sometimes slow) NFS volumes
  extraConfig: |
    save ""
  resources:
    limits:
      memory: 128Mi
    requests:
      cpu: 50m
      memory: 96Mi
  metrics:
    exporter:
      resources:
        limits:
          cpu: 250m
  # The probes run `sh -c valkey-cli ping` as an exec, which needs more than the 1 s default on a busy node
  # (observed on production: 32 readiness timeouts in 73 minutes while valkey itself answered in milliseconds).
  startupProbe:
    timeoutSeconds: 5
  livenessProbe:
    timeoutSeconds: 5
  readinessProbe:
    timeoutSeconds: 5
