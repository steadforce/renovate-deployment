suite: renovate-gitconfig external secret
release:
  name: renovate
templates:
- charts/renovate/templates/extra-manifests.yaml
values:
- ../values-subchart-overrides.yaml
# WORKAROUND for the libcurl redirect bug (see values-subchart-overrides.yaml); remove together with it.
tests:
- it: reads the gitea credentials of the stage for the renovate-gitconfig secret for local
  capabilities: &externalSecretCapabilities
    apiVersions:
    - external-secrets.io/v1/ExternalSecret
  values:
  - ../values-local.yaml
  asserts:
  - documentSelector:
      path: metadata.name
      value: renovate-gitconfig
    equal:
      path: spec.dataFrom
      value:
      - extract:
          key: /local/renovate/gitea
- it: reads the gitea credentials of the stage for the renovate-gitconfig secret for development
  capabilities: *externalSecretCapabilities
  values:
  - ../values-development.yaml
  asserts:
  - documentSelector:
      path: metadata.name
      value: renovate-gitconfig
    equal:
      path: spec.dataFrom
      value:
      - extract:
          key: /development/renovate/gitea
- it: reads the gitea credentials of the stage for the renovate-gitconfig secret for production
  capabilities: *externalSecretCapabilities
  values: &productionValues
  - ../values-production.yaml
  asserts:
  - documentSelector:
      path: metadata.name
      value: renovate-gitconfig
    equal:
      path: spec.dataFrom
      value:
      - extract:
          key: /production/renovate/gitea
- it: writes the renovate-gitconfig secret from the awssm-parameter-store with an hourly refresh
  capabilities: *externalSecretCapabilities
  values: *productionValues
  asserts:
  - documentSelector:
      path: metadata.name
      value: renovate-gitconfig
    equal:
      path: spec.secretStoreRef
      value:
        kind: ClusterSecretStore
        name: awssm-parameter-store
  - documentSelector:
      path: metadata.name
      value: renovate-gitconfig
    equal:
      path: spec.refreshInterval
      value: 1h
  - documentSelector:
      path: metadata.name
      value: renovate-gitconfig
    equal:
      path: spec.target.name
      value: renovate-gitconfig
# The ESO template expressions must survive the chart's tpl call unrendered.
- it: sends the gitea token as an http header for the gitea host of the endpoint
  capabilities: *externalSecretCapabilities
  values: *productionValues
  asserts:
  - documentSelector:
      path: metadata.name
      value: renovate-gitconfig
    equal:
      path: spec.target.template.engineVersion
      value: v2
  - documentSelector:
      path: metadata.name
      value: renovate-gitconfig
    equal:
      path: spec.target.template.data.gitconfig
      value: |
        [safe]
          directory = *
        [http "{{ .RENOVATE_ENDPOINT | trimSuffix "/" | trimSuffix "/api/v1" }}/"]
          extraHeader = Authorization: token {{ .RENOVATE_TOKEN }}
