suite: renovate cronjob
release:
  name: renovate
templates:
- charts/renovate/templates/cronjob.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: matches the local renovate cronjob snapshot
  values: &localValues
  - ../values-local.yaml
  asserts:
  - matchSnapshot: {}
- it: matches the development renovate cronjob snapshot
  values: &developmentValues
  - ../values-development.yaml
  asserts:
  - matchSnapshot: {}
- it: matches the production renovate cronjob snapshot
  values: &productionValues
  - ../values-production.yaml
  asserts:
  - matchSnapshot: {}
- it: zeroes renovate cpu and memory requests for local
  values: *localValues
  asserts:
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.limits.cpu
      pattern: &localCpuPattern "^0(m)?$"
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.limits.memory
      pattern: "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.requests.cpu
      pattern: *localCpuPattern
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.requests.memory
      pattern: "^0(Ki|Mi|Gi)?$"
- it: sets non-zero renovate resource limits and requests for development
  values: *developmentValues
  asserts: &renovateResourcesAssert
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.limits.cpu
      pattern: &cpuPattern "^[1-9][0-9]*(m)?$"
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.limits.memory
      pattern: &memoryPattern "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.requests.cpu
      pattern: *cpuPattern
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.requests.memory
      pattern: *memoryPattern
- it: sets non-zero renovate resource limits and requests for production
  values: *productionValues
  asserts: *renovateResourcesAssert
- it: sets production-specific resource limits and requests for renovate
  values: *productionValues
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].resources.limits.cpu
      value: 1500m
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].resources.limits.memory
      value: 1536Mi
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].resources.requests.memory
      value: 768Mi
- it: uses the ghcr.io renovate image for local
  values: *localValues
  asserts: &renovateImageAssert
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].image
      pattern: "^ghcr.io/renovatebot/renovate:"
- it: uses the ghcr.io renovate image for development
  values: *developmentValues
  asserts: *renovateImageAssert
- it: uses the ghcr.io renovate image for production
  values: *productionValues
  asserts: *renovateImageAssert
- it: runs the cronjob every minute for local
  values: *localValues
  asserts:
  - equal:
      path: spec.schedule
      value: "*/1 * * * *"
- it: runs the cronjob hourly at minute 13 for development
  values: *developmentValues
  asserts: &renovateScheduleAssert
  - equal:
      path: spec.schedule
      value: "13 */1 * * *"
- it: runs the cronjob hourly at minute 13 for production
  values: *productionValues
  asserts: *renovateScheduleAssert
- it: sets activeDeadlineSeconds to 1200 for local
  values: *localValues
  asserts: &renovateActiveDeadlineSecondsAssert
  - equal:
      path: spec.jobTemplate.spec.activeDeadlineSeconds
      value: 1200
- it: sets activeDeadlineSeconds to 1200 for development
  values: *developmentValues
  asserts: *renovateActiveDeadlineSecondsAssert
- it: sets activeDeadlineSeconds to 3060 for production
  values: *productionValues
  asserts:
  - equal:
      path: spec.jobTemplate.spec.activeDeadlineSeconds
      value: 3060
- it: forbids concurrent cronjob runs for local
  values: *localValues
  asserts: &renovateConcurrencyPolicyAssert
  - equal:
      path: spec.concurrencyPolicy
      value: Forbid
- it: forbids concurrent cronjob runs for development
  values: *developmentValues
  asserts: *renovateConcurrencyPolicyAssert
- it: forbids concurrent cronjob runs for production
  values: *productionValues
  asserts: *renovateConcurrencyPolicyAssert
- it: keeps two failed jobs for local
  values: *localValues
  asserts: &renovateFailedJobsHistoryLimitAssert
  - equal:
      path: spec.failedJobsHistoryLimit
      value: 2
- it: keeps two failed jobs for development
  values: *developmentValues
  asserts: *renovateFailedJobsHistoryLimitAssert
- it: keeps two failed jobs for production
  values: *productionValues
  asserts: *renovateFailedJobsHistoryLimitAssert
- it: retries failed jobs three times for local
  values: *localValues
  asserts: &renovateJobBackoffLimitAssert
  - equal:
      path: spec.jobTemplate.spec.backoffLimit
      value: 3
- it: retries failed jobs three times for development
  values: *developmentValues
  asserts: *renovateJobBackoffLimitAssert
- it: retries failed jobs three times for production
  values: *productionValues
  asserts: *renovateJobBackoffLimitAssert
- it: never restarts job pods for local
  values: *localValues
  asserts: &renovateJobRestartPolicyAssert
  - equal:
      path: spec.jobTemplate.spec.template.spec.restartPolicy
      value: Never
- it: never restarts job pods for development
  values: *developmentValues
  asserts: *renovateJobRestartPolicyAssert
- it: never restarts job pods for production
  values: *productionValues
  asserts: *renovateJobRestartPolicyAssert
- it: keeps one successful job for local
  values: *localValues
  asserts: &renovateSuccessfulJobsHistoryLimitAssert
  - equal:
      path: spec.successfulJobsHistoryLimit
      value: 1
- it: keeps one successful job for development
  values: *developmentValues
  asserts: *renovateSuccessfulJobsHistoryLimitAssert
- it: keeps one successful job for production
  values: *productionValues
  asserts: *renovateSuccessfulJobsHistoryLimitAssert
- it: loads env from the renovate-environment secret for local
  values: *localValues
  asserts: &renovateEnvFromAssert
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].envFrom
      value:
        - secretRef:
            name: renovate-environment
- it: loads env from the renovate-environment secret for development
  values: *developmentValues
  asserts: *renovateEnvFromAssert
- it: loads env from the renovate-environment secret for production
  values: *productionValues
  asserts: *renovateEnvFromAssert
- it: sets RENOVATE_REDIS_URL to the valkey service for local
  values: *localValues
  asserts: &renovateRedisUrlEnvAssert
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].env[?(@.name == "RENOVATE_REDIS_URL")].value
      value: redis://renovate-valkey
- it: sets RENOVATE_REDIS_URL to the valkey service for development
  values: *developmentValues
  asserts: *renovateRedisUrlEnvAssert
- it: sets RENOVATE_REDIS_URL to the valkey service for production
  values: *productionValues
  asserts: *renovateRedisUrlEnvAssert
- it: sets LOG_LEVEL to debug for local
  values: *localValues
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].env[?(@.name == "LOG_LEVEL")].value
      value: debug
- it: omits the LOG_LEVEL override for development
  values: *developmentValues
  asserts: &renovateLogLevelOmittedAssert
  - notExists:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].env[?(@.name == "LOG_LEVEL")]
- it: omits the LOG_LEVEL override for production
  values: *productionValues
  asserts: *renovateLogLevelOmittedAssert
