suite: test statefulset for redis used by renovate
release:
  name: renovate
templates:
- charts/renovate/charts/redis/templates/configmap.yaml
- charts/renovate/charts/redis/templates/health-configmap.yaml
- charts/renovate/charts/redis/templates/scripts-configmap.yaml
- charts/renovate/charts/redis/templates/secret.yaml
- charts/renovate/charts/redis/templates/master/application.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: check whether changes during development have side-effects on local redis statefulset
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-local.yaml
  asserts:
  - matchSnapshot: {}
- it: check whether changes during development have side-effects on development redis statefulset
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-development.yaml
  asserts:
  - matchSnapshot: {}
- it: check whether changes during development have side-effects on production redis statefulset
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-production.yaml
  asserts:
  - matchSnapshot: {}
- it: ensure statefulset resources for local redis
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-local.yaml
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[*].resources.limits.cpu
      pattern: "^0(m)*$"
  - matchRegex:
      path: spec.template.spec.containers[*].resources.limits.memory
      pattern: "^[1-9][0-9]*(Ki|Mi|Gi)*$"
  - matchRegex:
      path: spec.template.spec.containers[*].resources.requests.cpu
      pattern: "^0(m)*$"
  - matchRegex:
      path: spec.template.spec.containers[*].resources.requests.memory
      pattern: "^0(Ki|Mi|Gi)*$"
- it: ensure statefulset resources for development redis
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-development.yaml
  asserts: &renovateResourcesAssert
  - matchRegex:
      path: spec.template.spec.containers[*].resources.limits.cpu
      pattern: "^[1-9][0-9]*(m)*$"
  - matchRegex:
      path: spec.template.spec.containers[*].resources.limits.memory
      pattern: "^[1-9][0-9]*(Ki|Mi|Gi)*$"
  - matchRegex:
      path: spec.template.spec.containers[*].resources.requests.cpu
      pattern: "^[1-9][0-9]*(m)*$"
  - matchRegex:
      path: spec.template.spec.containers[*].resources.requests.memory
      pattern: "^[1-9][0-9]*(Ki|Mi|Gi)*$"
- it: ensure statefulset resources for production redis
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-production.yaml
  asserts: *renovateResourcesAssert
- it: ensure statefulset images for local redis container
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-local.yaml
  asserts: &redisImageAssert
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "redis")].image
      pattern: "^docker.io/bitnami/redis:"
- it: ensure statefulset images for development redis
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-development.yaml
  asserts: *redisImageAssert
- it: ensure statefulset images for production redis
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-production.yaml
  asserts: *redisImageAssert
- it: ensure statefulset volumeClaimTemplates for local redis container
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-local.yaml
  asserts: &redisVolumeClaimTemplatesAssert
  - equal:
      path: spec.volumeClaimTemplates
      value:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            labels:
              app.kubernetes.io/component: master
              app.kubernetes.io/instance: renovate
              app.kubernetes.io/name: redis
            name: redis-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Mi
            storageClassName: nfs1
- it: ensure statefulset volumeClaimTemplates for development redis
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-development.yaml
  asserts: *redisVolumeClaimTemplatesAssert
- it: ensure statefulset volumeClaimTemplates for production redis
  templates:
  - charts/renovate/charts/redis/templates/master/application.yaml
  values:
  - ../values-production.yaml
  asserts: *redisVolumeClaimTemplatesAssert
