suite: valkey cache
release:
  name: renovate
templates:
- charts/valkey/templates/deploy_valkey.yaml
- charts/valkey/templates/statefulset.yaml
- charts/valkey/templates/service.yaml
- charts/valkey/templates/pvc.yaml
- charts/valkey/templates/init_config.yaml
- charts/valkey/templates/metrics-svc.yaml
- charts/valkey/templates/servicemonitor.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: matches the local valkey deployment snapshot
  templates: &valkeyDeploymentTemplate
  - charts/valkey/templates/deploy_valkey.yaml
  values: &localValues
  - ../values-local.yaml
  documentSelector: &deploymentSelector
    path: kind
    value: Deployment
  asserts:
  - matchSnapshot: {}
- it: matches the development valkey statefulset snapshot
  templates: &valkeyStatefulsetTemplate
  - charts/valkey/templates/statefulset.yaml
  values: &developmentValues
  - ../values-development.yaml
  documentSelector: &statefulsetSelector
    path: kind
    value: StatefulSet
  asserts:
  - matchSnapshot: {}
- it: matches the production valkey statefulset snapshot
  templates: *valkeyStatefulsetTemplate
  values: &productionValues
  - ../values-production.yaml
  documentSelector: *statefulsetSelector
  asserts:
  - matchSnapshot: {}
- it: omits the valkey statefulset for local (standalone deployment)
  templates: *valkeyStatefulsetTemplate
  values: *localValues
  asserts:
  - hasDocuments:
      count: 0
- it: omits the valkey deployment for development (replicated statefulset)
  templates: *valkeyDeploymentTemplate
  values: *developmentValues
  asserts:
  - hasDocuments:
      count: 0
- it: omits the valkey deployment for production (replicated statefulset)
  templates: *valkeyDeploymentTemplate
  values: *productionValues
  asserts:
  - hasDocuments:
      count: 0
- it: zeroes valkey cpu and memory requests for local
  templates: *valkeyDeploymentTemplate
  values: *localValues
  documentSelector: *deploymentSelector
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.limits.cpu
      pattern: &localCpuPattern "^0(m)?$"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.limits.memory
      pattern: "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.requests.cpu
      pattern: *localCpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.requests.memory
      pattern: "^0(Ki|Mi|Gi)?$"
- it: sets non-zero valkey resource limits and requests for development
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: &valkeyResourcesAssert
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.limits.cpu
      pattern: &cpuPattern "^[1-9][0-9]*(m)?$"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.limits.memory
      pattern: &memoryPattern "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.requests.cpu
      pattern: *cpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.requests.memory
      pattern: *memoryPattern
- it: sets non-zero valkey resource limits and requests for production
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyResourcesAssert
- it: uses the docker.io valkey image for local
  templates: *valkeyDeploymentTemplate
  values: *localValues
  documentSelector: *deploymentSelector
  asserts: &valkeyImageAssert
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].image
      pattern: "^docker.io/valkey/valkey:"
- it: uses the docker.io valkey image for development
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyImageAssert
- it: uses the docker.io valkey image for production
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyImageAssert
- it: runs one valkey primary and three replicas for development
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: &valkeyReplicaCountAssert
  - equal:
      path: spec.replicas
      value: 4
- it: runs one valkey primary and three replicas for production
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyReplicaCountAssert
- it: requests a 100Mi nfs1 volume for local
  templates:
  - charts/valkey/templates/pvc.yaml
  values: *localValues
  asserts:
  - equal:
      path: spec.resources.requests.storage
      value: 100Mi
  - equal:
      path: spec.storageClassName
      value: nfs1
- it: requests a 100Mi nfs1 volume per valkey pod for development
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: &valkeyVolumeClaimTemplatesAssert
  - equal:
      path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
      value: 100Mi
  - equal:
      path: spec.volumeClaimTemplates[0].spec.storageClassName
      value: nfs1
- it: requests a 100Mi nfs1 volume per valkey pod for production
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyVolumeClaimTemplatesAssert
- it: zeroes metrics exporter cpu and memory requests for local
  templates: *valkeyDeploymentTemplate
  values: *localValues
  documentSelector: *deploymentSelector
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.limits.cpu
      pattern: *localCpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.limits.memory
      pattern: *memoryPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.requests.cpu
      pattern: *localCpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.requests.memory
      pattern: "^0(Ki|Mi|Gi)?$"
- it: sets non-zero metrics exporter resource limits and requests for development
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: &metricsExporterResourcesAssert
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.limits.cpu
      pattern: *cpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.limits.memory
      pattern: *memoryPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.requests.cpu
      pattern: *cpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.requests.memory
      pattern: *memoryPattern
- it: sets non-zero metrics exporter resource limits and requests for production
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *metricsExporterResourcesAssert
- it: sets production-specific memory limits and requests for valkey
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts:
  - equal:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.limits.memory
      value: 128Mi
  - equal:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.requests.memory
      value: 96Mi
- it: renders the valkey service targeted by RENOVATE_REDIS_URL for local
  templates: &valkeyServiceTemplate
  - charts/valkey/templates/service.yaml
  values: *localValues
  asserts: &valkeyServiceAssert
  - equal:
      path: metadata.name
      value: renovate-valkey
  - equal:
      path: spec.ports[0].port
      value: 6379
- it: renders the valkey service targeted by RENOVATE_REDIS_URL for development
  templates: *valkeyServiceTemplate
  values: *developmentValues
  asserts: *valkeyServiceAssert
- it: renders the valkey service targeted by RENOVATE_REDIS_URL for production
  templates: *valkeyServiceTemplate
  values: *productionValues
  asserts: *valkeyServiceAssert
- it: renders the valkey metrics service for local
  templates: &valkeyMetricsServiceTemplate
  - charts/valkey/templates/metrics-svc.yaml
  values: *localValues
  asserts: &valkeyMetricsServiceAssert
  - equal:
      path: metadata.labels["app.kubernetes.io/component"]
      value: metrics
  - equal:
      path: spec.ports[?(@.name == "metrics")].targetPort
      value: metrics
- it: renders the valkey metrics service for development
  templates: *valkeyMetricsServiceTemplate
  values: *developmentValues
  asserts: *valkeyMetricsServiceAssert
- it: renders the valkey metrics service for production
  templates: *valkeyMetricsServiceTemplate
  values: *productionValues
  asserts: *valkeyMetricsServiceAssert
- it: renders a valkey servicemonitor selected by the cluster prometheus for local
  templates: &valkeyServiceMonitorTemplate
  - charts/valkey/templates/servicemonitor.yaml
  values: *localValues
  asserts: &valkeyServiceMonitorAssert
  - isKind:
      of: ServiceMonitor
  - equal:
      path: metadata.labels.prometheus
      value: cluster-monitoring
  - equal:
      path: spec.endpoints[?(@.port == "metrics")].port
      value: metrics
  - equal:
      path: spec.selector.matchLabels["app.kubernetes.io/component"]
      value: metrics
- it: renders a valkey servicemonitor selected by the cluster prometheus for development
  templates: *valkeyServiceMonitorTemplate
  values: *developmentValues
  asserts: *valkeyServiceMonitorAssert
- it: renders a valkey servicemonitor selected by the cluster prometheus for production
  templates: *valkeyServiceMonitorTemplate
  values: *productionValues
  asserts: *valkeyServiceMonitorAssert
