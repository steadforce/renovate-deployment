suite: valkey cache
release:
  name: renovate
templates:
- charts/valkey/templates/deploy_valkey.yaml
- charts/valkey/templates/statefulset.yaml
- charts/valkey/templates/service.yaml
- charts/valkey/templates/pvc.yaml
- charts/valkey/templates/init_config.yaml
- charts/valkey/templates/servicemonitor.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: matches the local valkey deployment snapshot
  templates: &valkeyDeploymentTemplate
  - charts/valkey/templates/deploy_valkey.yaml
  values: &localValues
  - ../values-local.yaml
  documentSelector: &deploymentSelector
    path: kind
    value: Deployment
  asserts:
  - matchSnapshot: {}
- it: matches the development valkey statefulset snapshot
  templates: &valkeyStatefulsetTemplate
  - charts/valkey/templates/statefulset.yaml
  values: &developmentValues
  - ../values-development.yaml
  documentSelector: &statefulsetSelector
    path: kind
    value: StatefulSet
  asserts:
  - matchSnapshot: {}
- it: matches the production valkey statefulset snapshot
  templates: *valkeyStatefulsetTemplate
  values: &productionValues
  - ../values-production.yaml
  documentSelector: *statefulsetSelector
  asserts:
  - matchSnapshot: {}
- it: omits the valkey statefulset for local (standalone deployment)
  templates: *valkeyStatefulsetTemplate
  values: *localValues
  asserts:
  - hasDocuments:
      count: 0
- it: omits the valkey deployment for development (replicated statefulset)
  templates: *valkeyDeploymentTemplate
  values: *developmentValues
  asserts:
  - hasDocuments:
      count: 0
- it: omits the valkey deployment for production (replicated statefulset)
  templates: *valkeyDeploymentTemplate
  values: *productionValues
  asserts:
  - hasDocuments:
      count: 0
- it: ensure deployment resource limits and requests for local valkey
  templates: *valkeyDeploymentTemplate
  values: *localValues
  documentSelector: *deploymentSelector
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.limits.cpu
      pattern: &localCpuPattern "^0(m)?$"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.limits.memory
      pattern: "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.requests.cpu
      pattern: *localCpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.requests.memory
      pattern: "^0(Ki|Mi|Gi)?$"
- it: ensure statefulset resource limits and requests for development valkey
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: &valkeyResourcesAssert
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.limits.cpu
      pattern: &cpuPattern "^[1-9][0-9]*(m)?$"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.limits.memory
      pattern: &memoryPattern "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.requests.cpu
      pattern: *cpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].resources.requests.memory
      pattern: *memoryPattern
- it: ensure statefulset resource limits and requests for production valkey
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyResourcesAssert
- it: ensure image for local valkey container
  templates: *valkeyDeploymentTemplate
  values: *localValues
  documentSelector: *deploymentSelector
  asserts: &valkeyImageAssert
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "renovate-valkey")].image
      pattern: "^docker.io/valkey/valkey:"
- it: ensure image for development valkey container
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyImageAssert
- it: ensure image for production valkey container
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyImageAssert
- it: ensure statefulset runs one primary and three replicas for development
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: &valkeyReplicaCountAssert
  - equal:
      path: spec.replicas
      value: 4
- it: ensure statefulset runs one primary and three replicas for production
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyReplicaCountAssert
- it: ensure persistentVolumeClaim for local valkey
  templates:
  - charts/valkey/templates/pvc.yaml
  values: *localValues
  asserts:
  - equal:
      path: spec.resources.requests.storage
      value: 100Mi
  - equal:
      path: spec.storageClassName
      value: nfs1
- it: ensure volumeClaimTemplates for development valkey
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: &valkeyVolumeClaimTemplatesAssert
  - equal:
      path: spec.volumeClaimTemplates[0].spec.resources.requests.storage
      value: 100Mi
  - equal:
      path: spec.volumeClaimTemplates[0].spec.storageClassName
      value: nfs1
- it: ensure volumeClaimTemplates for production valkey
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *valkeyVolumeClaimTemplatesAssert
- it: ensure metrics exporter resource limits and requests for local valkey
  templates: *valkeyDeploymentTemplate
  values: *localValues
  documentSelector: *deploymentSelector
  asserts:
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.limits.cpu
      pattern: *localCpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.limits.memory
      pattern: *memoryPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.requests.cpu
      pattern: *localCpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.requests.memory
      pattern: "^0(Ki|Mi|Gi)?$"
- it: ensure metrics exporter resource limits and requests for development valkey
  templates: *valkeyStatefulsetTemplate
  values: *developmentValues
  documentSelector: *statefulsetSelector
  asserts: &metricsExporterResourcesAssert
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.limits.cpu
      pattern: *cpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.limits.memory
      pattern: *memoryPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.requests.cpu
      pattern: *cpuPattern
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "metrics")].resources.requests.memory
      pattern: *memoryPattern
- it: ensure metrics exporter resource limits and requests for production valkey
  templates: *valkeyStatefulsetTemplate
  values: *productionValues
  documentSelector: *statefulsetSelector
  asserts: *metricsExporterResourcesAssert
- it: ensure servicemonitor scrapes the valkey metrics service for all environments
  templates:
  - charts/valkey/templates/servicemonitor.yaml
  asserts:
  - isKind:
      of: ServiceMonitor
  - equal:
      path: metadata.labels.prometheus
      value: cluster-monitoring
  - equal:
      path: spec.endpoints[0].port
      value: metrics
  - equal:
      path: spec.selector.matchLabels["app.kubernetes.io/component"]
      value: metrics
