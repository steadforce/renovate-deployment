suite: renovate cronjob
release:
  name: renovate
templates:
- charts/renovate/templates/cronjob.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: matches the local renovate cronjob snapshot
  values: &localValues
  - ../values-local.yaml
  asserts:
  - matchSnapshot: {}
- it: matches the development renovate cronjob snapshot
  values: &developmentValues
  - ../values-development.yaml
  asserts:
  - matchSnapshot: {}
- it: matches the production renovate cronjob snapshot
  values: &productionValues
  - ../values-production.yaml
  asserts:
  - matchSnapshot: {}
- it: ensure cronjob resource limits and requests for local renovate
  values: *localValues
  asserts:
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.limits.cpu
      pattern: &localCpuPattern "^0(m)?$"
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.limits.memory
      pattern: "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.requests.cpu
      pattern: *localCpuPattern
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.requests.memory
      pattern: "^0(Ki|Mi|Gi)?$"
- it: ensure cronjob resource limits and requests for development renovate
  values: *developmentValues
  asserts: &renovateResourcesAssert
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.limits.cpu
      pattern: &cpuPattern "^[1-9][0-9]*(m)?$"
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.limits.memory
      pattern: &memoryPattern "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.requests.cpu
      pattern: *cpuPattern
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[*].resources.requests.memory
      pattern: *memoryPattern
- it: ensure cronjob resource limits and requests for production renovate
  values: *productionValues
  asserts: *renovateResourcesAssert
- it: sets production-specific resource limits and requests for renovate
  values: *productionValues
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].resources.limits.cpu
      value: 1500m
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].resources.limits.memory
      value: 1536Mi
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].resources.requests.memory
      value: 768Mi
- it: ensure cronjob images for local renovate container
  values: *localValues
  asserts: &renovateImageAssert
  - matchRegex:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].image
      pattern: "^ghcr.io/renovatebot/renovate:"
- it: ensure cronjob images for development renovate container
  values: *developmentValues
  asserts: *renovateImageAssert
- it: ensure cronjob images for production renovate container
  values: *productionValues
  asserts: *renovateImageAssert
- it: ensure local cronjob schedule
  values: *localValues
  asserts:
  - equal:
      path: spec.schedule
      value: "*/1 * * * *"
- it: ensure development cronjob schedule
  values: *developmentValues
  asserts: &renovateScheduleAssert
  - equal:
      path: spec.schedule
      value: "13 */1 * * *"
- it: ensure production cronjob schedule
  values: *productionValues
  asserts: *renovateScheduleAssert
- it: ensure local cronjob activeDeadlineSeconds
  values: *localValues
  asserts: &renovateActiveDeadlineSecondsAssert
  - equal:
      path: spec.jobTemplate.spec.activeDeadlineSeconds
      value: 1200
- it: ensure development cronjob activeDeadlineSeconds
  values: *developmentValues
  asserts: *renovateActiveDeadlineSecondsAssert
- it: ensure production cronjob activeDeadlineSeconds
  values: *productionValues
  asserts:
  - equal:
      path: spec.jobTemplate.spec.activeDeadlineSeconds
      value: 3060
- it: ensure local cronjob concurrencyPolicy
  values: *localValues
  asserts: &renovateConcurrencyPolicyAssert
  - equal:
      path: spec.concurrencyPolicy
      value: Forbid
- it: ensure development cronjob concurrencyPolicy
  values: *developmentValues
  asserts: *renovateConcurrencyPolicyAssert
- it: ensure production cronjob concurrencyPolicy
  values: *productionValues
  asserts: *renovateConcurrencyPolicyAssert
- it: ensure local cronjob failedJobsHistoryLimit
  values: *localValues
  asserts: &renovateFailedJobsHistoryLimitAssert
  - equal:
      path: spec.failedJobsHistoryLimit
      value: 2
- it: ensure development cronjob failedJobsHistoryLimit
  values: *developmentValues
  asserts: *renovateFailedJobsHistoryLimitAssert
- it: ensure production cronjob failedJobsHistoryLimit
  values: *productionValues
  asserts: *renovateFailedJobsHistoryLimitAssert
- it: ensure local cronjob jobBackoffLimit
  values: *localValues
  asserts: &renovateJobBackoffLimitAssert
  - equal:
      path: spec.jobTemplate.spec.backoffLimit
      value: 3
- it: ensure development cronjob jobBackoffLimit
  values: *developmentValues
  asserts: *renovateJobBackoffLimitAssert
- it: ensure production cronjob jobBackoffLimit
  values: *productionValues
  asserts: *renovateJobBackoffLimitAssert
- it: ensure local cronjob jobRestartPolicy
  values: *localValues
  asserts: &renovateJobRestartPolicyAssert
  - equal:
      path: spec.jobTemplate.spec.template.spec.restartPolicy
      value: Never
- it: ensure development cronjob jobRestartPolicy
  values: *developmentValues
  asserts: *renovateJobRestartPolicyAssert
- it: ensure production cronjob jobRestartPolicy
  values: *productionValues
  asserts: *renovateJobRestartPolicyAssert
- it: ensure local cronjob successfulJobsHistoryLimit
  values: *localValues
  asserts: &renovateSuccessfulJobsHistoryLimitAssert
  - equal:
      path: spec.successfulJobsHistoryLimit
      value: 1
- it: ensure development cronjob successfulJobsHistoryLimit
  values: *developmentValues
  asserts: *renovateSuccessfulJobsHistoryLimitAssert
- it: ensure production cronjob successfulJobsHistoryLimit
  values: *productionValues
  asserts: *renovateSuccessfulJobsHistoryLimitAssert
- it: ensure local cronjob uses envFrom renovate-environment secret for environment variables
  values: *localValues
  asserts: &renovateEnvFromAssert
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].envFrom
      value:
        - secretRef:
            name: renovate-environment
- it: ensure development cronjob uses envFrom renovate-environment secret for environment variables
  values: *developmentValues
  asserts: *renovateEnvFromAssert
- it: ensure production cronjob uses envFrom renovate-environment secret for environment variables
  values: *productionValues
  asserts: *renovateEnvFromAssert
- it: ensure local cronjob container connects to the Valkey cache
  values: *localValues
  asserts: &renovateRedisUrlEnvAssert
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].env[?(@.name == "RENOVATE_REDIS_URL")].value
      value: redis://renovate-valkey
- it: ensure development cronjob container connects to the Valkey cache
  values: *developmentValues
  asserts: *renovateRedisUrlEnvAssert
- it: ensure production cronjob container connects to the Valkey cache
  values: *productionValues
  asserts: *renovateRedisUrlEnvAssert
- it: ensure local cronjob container sets LOG_LEVEL to debug
  values: *localValues
  asserts:
  - equal:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].env[?(@.name == "LOG_LEVEL")].value
      value: debug
- it: ensure development cronjob container omits the LOG_LEVEL override
  values: *developmentValues
  asserts: &renovateLogLevelOmittedAssert
  - notExists:
      path: spec.jobTemplate.spec.template.spec.containers[?(@.name == "renovate")].env[?(@.name == "LOG_LEVEL")]
- it: ensure production cronjob container omits the LOG_LEVEL override
  values: *productionValues
  asserts: *renovateLogLevelOmittedAssert
