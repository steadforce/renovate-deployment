suite: test statefulset for redis replica
release:
  name: renovate
templates:
- charts/renovate/charts/redis/templates/configmap.yaml
- charts/renovate/charts/redis/templates/health-configmap.yaml
- charts/renovate/charts/redis/templates/scripts-configmap.yaml
- charts/renovate/charts/redis/templates/secret.yaml
- charts/renovate/charts/redis/templates/replicas/application.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: omits the replica statefulset for local redis (standalone architecture)
  templates: &redisReplicaApplicationTemplate
  - charts/renovate/charts/redis/templates/replicas/application.yaml
  values:
  - ../values-local.yaml
  asserts:
  - hasDocuments:
      count: 0
- it: matches the development redis replica statefulset snapshot
  templates: *redisReplicaApplicationTemplate
  values: &developmentValues
  - ../values-development.yaml
  asserts:
  - matchSnapshot: {}
- it: matches the production redis replica statefulset snapshot
  templates: *redisReplicaApplicationTemplate
  values: &productionValues
  - ../values-production.yaml
  asserts:
  - matchSnapshot: {}
- it: ensure statefulset resource limits and requests for development redis
  templates: *redisReplicaApplicationTemplate
  values: *developmentValues
  asserts: &renovateResourcesAssert
  - matchRegex:
      path: spec.template.spec.containers[*].resources.limits.cpu
      pattern: &cpuPattern "^[1-9][0-9]*(m)?$"
  - matchRegex:
      path: spec.template.spec.containers[*].resources.limits.memory
      pattern: &memoryPattern "^[1-9][0-9]*(Ki|Mi|Gi)?$"
  - matchRegex:
      path: spec.template.spec.containers[*].resources.requests.cpu
      pattern: *cpuPattern
  - matchRegex:
      path: spec.template.spec.containers[*].resources.requests.memory
      pattern: *memoryPattern
- it: ensure statefulset resource limits and requests for production redis
  templates: *redisReplicaApplicationTemplate
  values: *productionValues
  asserts: *renovateResourcesAssert
- it: ensure statefulset images for development redis
  templates: *redisReplicaApplicationTemplate
  values: *developmentValues
  asserts: &redisImageAssert
  - matchRegex:
      path: spec.template.spec.containers[?(@.name == "redis")].image
      pattern: "^docker.io/bitnamilegacy/redis:"
- it: ensure statefulset images for production redis
  templates: *redisReplicaApplicationTemplate
  values: *productionValues
  asserts: *redisImageAssert
- it: ensure statefulset volumeClaimTemplates for development redis
  templates: *redisReplicaApplicationTemplate
  values: *developmentValues
  asserts: &redisVolumeClaimTemplatesAssert
  - equal:
      path: spec.volumeClaimTemplates
      value:
        - apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            labels:
              app.kubernetes.io/component: replica
              app.kubernetes.io/instance: renovate
              app.kubernetes.io/name: redis
            name: redis-data
          spec:
            accessModes:
              - ReadWriteOnce
            resources:
              requests:
                storage: 100Mi
            storageClassName: nfs1
- it: ensure statefulset volumeClaimTemplates for production redis
  templates: *redisReplicaApplicationTemplate
  values: *productionValues
  asserts: *redisVolumeClaimTemplatesAssert
