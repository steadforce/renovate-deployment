suite: renovate-environment external secret
capabilities:
  apiVersions:
  - external-secrets.io/v1/ExternalSecret
release:
  name: renovate
templates:
- charts/renovate/templates/extra-manifests.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: matches the local renovate-environment external secret snapshot
  values: &localValues
  - ../values-local.yaml
  asserts:
  - matchSnapshot: {}
- it: matches the development renovate-environment external secret snapshot
  values: &developmentValues
  - ../values-development.yaml
  asserts:
  - matchSnapshot: {}
- it: matches the production renovate-environment external secret snapshot
  values: &productionValues
  - ../values-production.yaml
  asserts:
  - matchSnapshot: {}
- it: sets target secret name to renovate-environment
  asserts:
  - equal:
      path: spec.target.name
      value: renovate-environment
- it: sets refresh interval to one hour
  asserts:
  - equal:
      path: spec.refreshInterval
      value: 1h
- it: sets secret store reference to awssm-parameter-store
  asserts:
  - equal:
      path: spec.secretStoreRef
      value:
        kind: ClusterSecretStore
        name: awssm-parameter-store
- it: sets the gitea dataFrom key for local
  values: *localValues
  asserts:
  - equal:
      path: spec.dataFrom
      value:
        - extract:
            key: /local/renovate/gitea
- it: sets the gitea dataFrom key for development
  values: *developmentValues
  asserts:
  - equal:
      path: spec.dataFrom
      value:
        - extract:
            key: /development/renovate/gitea
- it: sets the gitea dataFrom key for production
  values: *productionValues
  asserts:
  - equal:
      path: spec.dataFrom
      value:
        - extract:
            key: /production/renovate/gitea
