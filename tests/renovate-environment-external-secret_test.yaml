suite: renovate-environment external secret
release:
  name: renovate
templates:
- charts/renovate/templates/extra-manifests.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: matches the local renovate-environment external secret snapshot
  # set per test: a test-level capabilities block does not override
  # suite-level capabilities, so the omission case needs its own
  capabilities: &externalSecretCapabilities
    apiVersions:
    - external-secrets.io/v1/ExternalSecret
  values: &localValues
  - ../values-local.yaml
  asserts:
  - matchSnapshot: {}
- it: matches the development renovate-environment external secret snapshot
  capabilities: *externalSecretCapabilities
  values: &developmentValues
  - ../values-development.yaml
  asserts:
  - matchSnapshot: {}
- it: matches the production renovate-environment external secret snapshot
  capabilities: *externalSecretCapabilities
  values: &productionValues
  - ../values-production.yaml
  asserts:
  - matchSnapshot: {}
- it: sets the target secret name to renovate-environment by default
  capabilities: *externalSecretCapabilities
  asserts:
  - equal:
      path: spec.target.name
      value: renovate-environment
- it: sets the refresh interval to one hour by default
  capabilities: *externalSecretCapabilities
  asserts:
  - equal:
      path: spec.refreshInterval
      value: 1h
- it: references the awssm-parameter-store cluster secret store by default
  capabilities: *externalSecretCapabilities
  asserts:
  - equal:
      path: spec.secretStoreRef
      value:
        kind: ClusterSecretStore
        name: awssm-parameter-store
- it: sets the gitea dataFrom key for local
  capabilities: *externalSecretCapabilities
  values: *localValues
  asserts:
  - equal:
      path: spec.dataFrom
      value:
        - extract:
            key: /local/renovate/gitea
- it: sets the gitea dataFrom key for development
  capabilities: *externalSecretCapabilities
  values: *developmentValues
  asserts:
  - equal:
      path: spec.dataFrom
      value:
        - extract:
            key: /development/renovate/gitea
- it: sets the gitea dataFrom key for production
  capabilities: *externalSecretCapabilities
  values: *productionValues
  asserts:
  - equal:
      path: spec.dataFrom
      value:
        - extract:
            key: /production/renovate/gitea
- it: omits the renovate-environment external secret without the ExternalSecret API
  values: *productionValues
  asserts:
  - hasDocuments:
      count: 0
