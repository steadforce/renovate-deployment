suite: test if the settings for the renovate-environment-external-secret are correct
capabilities:
  apiVersions:
  - external-secrets.io/v1/ExternalSecret
release:
  name: renovate
templates:
- charts/renovate/templates/extra-manifests.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: snapshot test for detecting side effects on local renovate-environment-external-secret during local development
  values:
  - ../values-local.yaml
  asserts:
  - matchSnapshot: {}
- it: snapshot test for detecting side effects on development renovate-environment-external-secret during local development
  values:
  - ../values-development.yaml
  asserts:
  - matchSnapshot: {}
- it: snapshot test for detecting side effects on production renovate-environment-external-secret during local development
  values:
  - ../values-production.yaml
  asserts:
  - matchSnapshot: {}
- it: target secret name is set to the name of renovate-environment
  asserts:
  - equal:
      path: spec.target.name
      value: renovate-environment
- it: refresh interval is set to one hour
  asserts:
  - equal:
      path: spec.refreshInterval
      value: 1h
- it: secret store reference is set to awssm-parameter-store
  asserts:
  - equal:
      path: spec.secretStoreRef
      value:
        kind: ClusterSecretStore
        name: awssm-parameter-store
- it: dataFrom for local cluster is referencing the correct key(s)
  values:
  - ../values-local.yaml
  asserts:
  - equal:
      path: spec.dataFrom
      value:
        - extract:
            key: /local/renovate/gitea
- it: dataFrom for development cluster is referencing the correct key(s)
  values:
  - ../values-development.yaml
  asserts:
  - equal:
      path: spec.dataFrom
      value:
        - extract:
            key: /development/renovate/gitea
- it: dataFrom for production cluster is referencing the correct key(s)
  values:
  - ../values-production.yaml
  asserts:
  - equal:
      path: spec.dataFrom
      value:
        - extract:
            key: /production/renovate/gitea
