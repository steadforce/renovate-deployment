suite: test if the settings for the renovate config configmap are correct
release:
  name: renovate
templates:
- charts/renovate/templates/config.yaml
values:
- ../values-subchart-overrides.yaml
tests:
- it: snapshot test for detecting side effects on local renovate config configmap during local development
  values:
  - ../values-local.yaml
  asserts:
  - matchSnapshot: {}
- it: snapshot test for detecting side effects on development renovate config configmap during local development
  values:
  - ../values-development.yaml
  asserts:
  - matchSnapshot: {}
- it: snapshot test for detecting side effects on renovate config configmap during local development
  values:
  - ../values-production.yaml
  asserts:
  - matchSnapshot: {}
- it: data for local cluster is referencing the correct key(s)
  values:
  - ../values-local.yaml
  asserts: &dataAssert
  - equal:
      path: data
      value:
        config.json: |-
          {
             "autodiscover": true,
             "onboardingConfig": {
               "$schema": "https://docs.renovatebot.com/renovate-schema.json",
               "extends": [
                 "config:recommended",
                 ":dependencyDashboard"
               ],
               "postUpdateOptions": [
                 "helmUpdateSubChartArchives"
               ]
             },
             "packageRules": [
               {
                 "matchDatasources": [
                   "pypi"
                 ],
                 "matchUpdateTypes": [
                   "minor",
                   "patch"
                 ],
                 "groupName": "{{manager}} dependencies non-major",
                 "groupSlug": "dependencies-non-major",
                 "additionalBranchPrefix": "{{manager}}-"
               }
             ]
          }
- it: data for development cluster is referencing the correct key(s)
  values:
  - ../values-development.yaml
  asserts: *dataAssert
- it: data for production cluster is referencing the correct key(s)
  values:
  - ../values-production.yaml
  asserts: *dataAssert
