renovate:
  cronjob:
    activeDeadlineSeconds: 1200
    concurrencyPolicy: Forbid
    failedJobsHistoryLimit: 2
    jobBackoffLimit: 3
    jobRestartPolicy: Never
    schedule: '13 */1 * * *'
    successfulJobsHistoryLimit: 1

  env:
    RENOVATE_REDIS_URL: redis://renovate-valkey

  resources:
    limits:
     cpu: 1000m
     memory: 768Mi
    requests:
     cpu: 600m
     memory: 512Mi

  renovate:
    # hostRules: the Gitea hosts resolve to internal addresses, which Renovate will block by
    # default (internalHostAccess=block) in a future major release
    config: |
      {
         "autodiscover": true,
         "hostRules": [
           {
             "matchHost": "gitea.dev.k8s01.steadforce.com",
             "allowInternal": true
           },
           {
             "matchHost": "gitea.k8s01.steadforce.com",
             "allowInternal": true
           }
         ],
         "onboardingConfig": {
           "$schema": "https://docs.renovatebot.com/renovate-schema.json",
           "extends": [
             "config:recommended",
             ":dependencyDashboard"
           ],
           "postUpdateOptions": [
             "helmUpdateSubChartArchives"
           ]
         },
         "packageRules": [
           {
             "matchDatasources": [
               "pypi"
             ],
             "matchUpdateTypes": [
               "minor",
               "patch"
             ],
             "groupName": "{{manager}} dependencies non-major",
             "groupSlug": "dependencies-non-major",
             "additionalBranchPrefix": "{{manager}}-"
           }
         ]
      }
  envFrom:
  - secretRef:
      name: renovate-environment
  # WORKAROUND, remove once Ubuntu fixes curl: with libcurl 8.5.0-2ubuntu10.16 (Renovate image 44.164.1 and later),
  # git wrongly detects a redirect after the first request and drops the token Renovate embeds in the clone URL, so
  # every private repository fails with "could not read Username". A system gitconfig sends the token as an HTTP
  # header instead, which git keeps. Remove it together with the renovate-gitconfig ExternalSecret below when a
  # Renovate image with a fixed libcurl works without it.
  extraVolumes:
  - name: gitconfig
    secret:
      secretName: renovate-gitconfig
  extraVolumeMounts:
  - name: gitconfig
    mountPath: /etc/gitconfig
    subPath: gitconfig
    readOnly: true
  extraObjects:
  - |
    {{- if .Capabilities.APIVersions.Has "external-secrets.io/v1/ExternalSecret" }}
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: &name renovate-environment
    spec:
      dataFrom:
      - extract:
          key: /{{ .Values.global.stage }}/renovate/gitea
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: awssm-parameter-store
      target:
        name: *name
    {{- end }}
  # WORKAROUND for the libcurl redirect bug, see extraVolumes above; remove together with it.
  - |
    {{- if .Capabilities.APIVersions.Has "external-secrets.io/v1/ExternalSecret" }}
    apiVersion: external-secrets.io/v1
    kind: ExternalSecret
    metadata:
      name: &name renovate-gitconfig
    spec:
      dataFrom:
      - extract:
          key: /{{ .Values.global.stage }}/renovate/gitea
      refreshInterval: 1h
      secretStoreRef:
        kind: ClusterSecretStore
        name: awssm-parameter-store
      target:
        name: *name
        template:
          engineVersion: v2
          data:
            # replaces the image's /etc/gitconfig, so it keeps its safe.directory setting
            gitconfig: |
              [safe]
                directory = *
              [http "{{ `{{ .RENOVATE_ENDPOINT | trimSuffix "/" | trimSuffix "/api/v1" }}` }}/"]
                extraHeader = Authorization: token {{ `{{ .RENOVATE_TOKEN }}` }}
    {{- end }}

valkey:
  replica:
    enabled: true
    replicas: 3
    persistence:
      size: 100Mi
      storageClass: nfs1
  resources:
    limits:
      cpu: 300m
      memory: 48Mi
    requests:
      cpu: 15m
      memory: 24Mi
  metrics:
    enabled: true
    serviceMonitor:
      enabled: true
      extraLabels:
        prometheus: cluster-monitoring
    exporter:
      resources:
        limits:
          cpu: 100m
          memory: 48Mi
        requests:
          cpu: 5m
          memory: 24Mi
